[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ttvn"
version = "0.1.0"
description = "Tool việt hóa game Unity trên Android (Magic Survival)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "UnityPy>=1.20",
]

[project.scripts]
ttvn = "ttvn.cli:main"

[tool.setuptools]
packages = ["ttvn"]
