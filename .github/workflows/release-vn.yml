name: Đăng bản việt hóa lên Releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ghép các phần thành file .apk
        run: |
          cat release-parts/MagicSurvival-VN.apk.part-* > MagicSurvival-VN.apk
          echo "7eff435b5c36008716e11de0b969df81efe4faa3b1892a424384f1a2a42442f3  MagicSurvival-VN.apk" | sha256sum -c -

      - name: Đăng lên Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create vn-full-0.99 \
            --title "Magic Survival 0.99 - Việt hóa hoàn chỉnh" \
            --notes "Bản việt hóa đầy đủ. File .apk cài trực tiếp không cần SAI." \
            MagicSurvival-VN.apk \
            || gh release upload vn-full-0.99 MagicSurvival-VN.apk --clobber
