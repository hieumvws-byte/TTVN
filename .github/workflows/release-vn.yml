name: Đăng bản việt hóa lên Releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ghép các phần thành file .apks
        run: |
          cat release-parts/MagicSurvival-VN-full.apks.part-* > MagicSurvival-VN-full.apks
          echo "592c90b6ad93f1b0c6f87ee111459555da4ad01d0f724945155e7155645a121a  MagicSurvival-VN-full.apks" | sha256sum -c -

      - name: Đăng lên Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create vn-full-0.99 \
            --title "Magic Survival 0.99 - Việt hóa hoàn chỉnh" \
            --notes "Bản việt hóa đầy đủ 6 file dictionary (menu, phép thuật, trường phái, cổ vật, cộng hưởng, nhật ký - 1.735 chuỗi). Cài bằng app SAI - xem tools/README.md" \
            MagicSurvival-VN-full.apks \
            || gh release upload vn-full-0.99 MagicSurvival-VN-full.apks --clobber
